        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: weekStart is Monday UTC; hours is total availability across all
        projects, rather than a separate budget for one team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weekStart: &id003
                  type: string
                  format: date
                hours:
                  type: number
                  minimum: 0
                  maximum: 100
                  multipleOf: 0.25
                skills:
                  type: array
                  items: &id004
                    description: Skill values must be sent exactly as listed.
                    enum:
                    - Any skill
                    - Architecture
                    - Backend
                    - Frontend
                    - Testing
                    - Documentation
                    - Databases
              required:
              - weekStart
              - hours
