              - choice
  /projects/{id}/decisions/{decisionId}:
    patch:
      summary: Record a decision outcome
      tags:
      - Collaboration
      operationId: patch_projects_id_decisions_decisionId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session missing or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Object unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
