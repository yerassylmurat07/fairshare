              schema:
                $ref: '#/components/schemas/Error'
      description: weekStart — понедельник UTC; hours — общая доступность во всех
        проектах, не отдельная доступность в одной команде.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weekStart: &id003
                  type: string
                  format: date
                hours:
                  type: number
                  minimum: 0
                  maximum: 100
                  multipleOf: 0.25
                skills:
                  type: array
                  items: &id004
                    enum:
                    - Любой навык
                    - Архитектура
                    - Backend
                    - Frontend
                    - Тестирование
                    - Документация
                    - Базы данных
              required:
              - weekStart
              - hours
