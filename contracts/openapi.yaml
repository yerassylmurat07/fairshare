components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fairshare_session
  schemas:
    Error:
      type: object
      properties:
        error: *id001
      required:
      - error
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    Id:
      type: object
      properties:
        id: *id002
      required:
      - id
    User:
      type: object
      properties:
        id: *id002
        name: *id001
        email:
          type: string
          format: email
        initials: *id001
        color: *id001
        skills:
          type: array
          items: *id001
      required:
      - id
      - name
      - email
      - initials
      - color
      - skills
    Project:
      type: object
      properties:
        id: *id002
        teamId: *id002
        name: *id001
        course: *id001
        teamName: *id001
      required:
      - id
      - teamId
      - name
      - course
      - teamName
    Milestone:
      type: object
      properties:
        id: *id002
        projectId: *id002
        title: *id001
        dueDate: *id003
        weekStart: *id003
        revision:
          type: integer
          minimum: 1
      required:
      - id
      - projectId
      - title
      - dueDate
      - weekStart
      - revision
    Member:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          role:
            enum:
            - leader
            - member
          capacity:
            type: number
          load:
            type: number
        required:
        - role
        - capacity
        - load
    TaskInput:
      type: object
      properties:
        title: &id007
          type: string
          minLength: 3
          maxLength: 120
        goal: &id008
          type: string
          minLength: 3
          maxLength: 800
        firstStep: &id009
          type: string
          minLength: 3
          maxLength: 800
        deliverable: &id010
          type: string
          minLength: 3
          maxLength: 800
        estimate: &id011
          type: number
          exclusiveMinimum: 0
          maximum: 100
          multipleOf: 0.25
        skill: *id004
        dependencyId: &id005
          type:
          - string
          - 'null'
          format: uuid
      required:
      - title
      - goal
      - firstStep
      - deliverable
      - estimate
      - skill
    Assignment:
      type: object
      properties:
        taskId: *id002
        memberId: *id005
        reason: *id001
        estimate:
          type: number
      required:
      - taskId
      - memberId
      - reason
      - estimate
    Allocation:
      type: object
      properties:
        id: *id002
        milestoneId: *id002
        revision:
          type: integer
        status:
          enum:
          - pending
          - approved
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        loads:
          type: array
          items:
            type: object
            properties:
              memberId: *id002
              name: *id001
              capacity:
                type: number
              before:
                type: number
              after:
                type: number
            required:
            - memberId
            - name
            - capacity
            - before
            - after
        warnings:
          type: array
          items: *id001
      required:
      - id
      - milestoneId
      - revision
      - status
      - assignments
      - loads
      - warnings
    Resource:
      type: object
      properties:
        id: *id002
        projectId: *id002
        authorId: *id002
        title: *id001
        url:
          type: string
          format: uri
        author: *id001
        createdAt: *id006
      required:
      - id
      - projectId
      - authorId
      - title
      - url
      - author
      - createdAt
    Decision:
      type: object
      properties:
        id: *id002
        projectId: *id002
        authorId: *id002
        title: *id001
        context: *id001
        status:
          enum:
          - open
          - accepted
          - declined
        author: *id001
        'yes':
          type: integer
        'no':
          type: integer
        myVote:
          enum:
          - 'yes'
          - 'no'
          - null
        createdAt: *id006
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - projectId
      - authorId
      - title
      - context
      - status
      - author
      - 'yes'
      - 'no'
      - myVote
      - createdAt
      - closedAt
    Task:
      allOf:
      - $ref: '#/components/schemas/TaskInput'
      - type: object
        properties:
          id: *id002
          projectId: *id002
          milestoneId: *id002
          assigneeId: *id005
          status:
            enum:
            - planned
            - in_progress
            - done
          helpReason:
            type:
            - string
            - 'null'
          evidence: *id001
          version:
            type: integer
          createdAt: *id006
        required:
        - id
        - projectId
        - milestoneId
        - assigneeId
        - status
        - helpReason
        - evidence
        - version
        - createdAt
    Workspace:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      required:
      - user
      - projects
    ProjectState:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        milestone:
          $ref: '#/components/schemas/Milestone'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        role:
          enum:
          - leader
          - member
      required:
      - project
      - milestone
      - milestones
      - members
      - tasks
      - role
    TaskPatch:
      type: object
      properties:
        title: *id007
        goal: *id008
        firstStep: *id009
        deliverable: *id010
        estimate: *id011
        skill: *id004
        dependencyId: *id005
        version:
          type: integer
          minimum: 1
        status:
          enum:
          - planned
          - in_progress
          - done
        assigneeId: *id005
        helpReason:
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 400
        evidence:
          type: string
          maxLength: 1200
        override:
          type: boolean
          default: false
      required:
      - version
    TaskCreate:
      allOf:
      - $ref: '#/components/schemas/TaskInput'
      - type: object
        properties:
          milestoneId: *id002
        required:
        - milestoneId
    Login:
      type: object
      properties:
        email: &id012
          type: string
          format: email
        password: &id013
          type: string
          minLength: 10
          maxLength: 128
      required:
      - email
      - password
    Register:
      type: object
      properties:
        email: *id012
        password: *id013
        name:
          type: string
          minLength: 2
          maxLength: 80
        teamName:
          type: string
          minLength: 2
          maxLength: 80
      required:
      - email
      - password
      - name
      - teamName
    Discussion:
      type: object
      properties:
        comments:
          type: array
          items:
            type: object
            properties:
              id: *id002
              taskId: *id002
              authorId: *id002
              name: *id001
              initials: *id001
              color: *id001
              body: *id001
              createdAt: *id006
            required:
            - id
            - taskId
            - authorId
            - name
            - initials
            - color
            - body
            - createdAt
        checklist:
          type: array
          items:
            type: object
            properties:
              id: *id002
              taskId: *id002
              title: *id001
              done:
                type: boolean
              createdAt: *id006
            required:
            - id
            - taskId
            - title
            - done
            - createdAt
      required:
      - comments
      - checklist
